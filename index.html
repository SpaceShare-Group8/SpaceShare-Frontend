<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceShare — On-Demand Workspace Marketplace</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Background Slider Container -->
    <div class="hero-slider" id="heroSlider">
        <!-- Slide 1 -->
        <div class="slide active" style="background-color: #333333;">
            <div class="slide-overlay"></div>
        </div>
        <!-- Slide 2 -->
        <div class="slide" style="background-image: url('file_00000000b52081f4b6aa5029eccc00e7.png');">
            <div class="slide-overlay"></div>
        </div>
        <!-- Slide 3 -->
        <div class="slide" style="background-image: url('file_000000003f8c81f48aabe11470ae9229.png');">
            <div class="slide-overlay"></div>
        </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="page-container">
        <!-- Header / Navigation -->
        <header class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="file_000000003f8c81f48aabe11470ae9229.png" alt="SpaceShare Logo" style="width: 20px; height: 20px; object-fit: contain;">
                </div>
                <span class="logo-text">SpaceShare</span>
            </div>
        </header>

        <!-- Hero Content Section -->
        <main class="hero-content">
            <div class="badge" id="slideBadge">FIND YOUR SPACE</div>
            
            <h1 class="hero-title" id="slideTitle">SpaceShare puts inspiring workspaces at your finger tips</h1>
            
            <p class="hero-subtitle" id="slideSubtitle">Browse, book and unlock unique spaces tailored to your vibe, anywhere and anytime.</p>
        </main>

        <!-- Footer Actions & Pagination -->
        <footer class="hero-footer">
            <div class="pagination-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>

            <div class="action-buttons">
                <a href="pages/login.html" class="btn btn-secondary">Sign in</a>
                <a href="pages/signup.html" class="btn btn-primary">Get Started</a>
            </div>
        </footer>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
