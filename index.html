<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceShare — Find Your Space</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Styles - Path corrected for root level -->
    <link rel="stylesheet" href="onboarding.css" />
</head>
<body>

    <!-- ============================================================ -->
    <!-- BACKGROUND SLIDER — 3 SLIDES                                 -->
    <!-- ============================================================ -->
    <div class="hero-slider" id="heroSlider" aria-hidden="true">

        <!-- Slide 1 -->
        <div class="slide active" 
             data-index="0"
             data-badge="FIND YOUR SPACE"
             data-title="SpaceShare puts inspiring workspaces at your fingertips"
             data-subtitle="Browse, book and unlock unique spaces tailored to your vibe, anywhere and anytime.">
            <div class="slide-image" style="background-image: url('src/assets/splashscreen1.png');"></div>
        </div>

        <!-- Slide 2 -->
        <div class="slide" 
             data-index="1"
             data-badge="CONNECT &amp; COLLABORATE"
             data-title="Spaces that inspire collaboration"
             data-subtitle="Access premium rooms and co-working spaces designed to fuel team productivity.">
            <div class="slide-image" style="background-image: url('src/assets/splashscreen2.jpeg');"></div>
        </div>

        <!-- Slide 3 -->
        <div class="slide" 
             data-index="2"
             data-badge="HOST &amp; EARN"
             data-title="Host, Share and Earn"
             data-subtitle="List your underutilized space or discover stunning locations curated just for you.">
            <div class="slide-image" style="background-image: url('src/assets/Splashscreen3.png');"></div>
        </div>

        <!-- Overlay for all slides -->
        <div class="slide-overlay"></div>
    </div>

    <!-- ============================================================ -->
    <!-- MAIN CONTENT                                                -->
    <!-- ============================================================ -->
    <div class="page-container">

        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
                        <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#8FB4EC"/>
                    </svg>
                </div>
                <span class="logo-text">SpaceShare</span>
            </div>
        </header>

        <!-- Hero Content -->
        <main class="hero-content">
            <span class="badge" id="slideBadge">FIND YOUR SPACE</span>
            <h1 class="hero-title" id="slideTitle">SpaceShare puts inspiring workspaces at your fingertips</h1>
            <p class="hero-subtitle" id="slideSubtitle">Browse, book and unlock unique spaces tailored to your vibe, anywhere and anytime.</p>
        </main>

        <!-- Footer -->
        <footer class="hero-footer">
            <!-- Pagination Dots -->
            <div class="pagination-dots" id="paginationDots" role="tablist" aria-label="Hero slides">
                <button class="dot active" data-index="0" role="tab" aria-selected="true" aria-label="Slide 1">
                    <span class="dot-fill"></span>
                </button>
                <button class="dot" data-index="1" role="tab" aria-selected="false" aria-label="Slide 2">
                    <span class="dot-fill"></span>
                </button>
                <button class="dot" data-index="2" role="tab" aria-selected="false" aria-label="Slide 3">
                    <span class="dot-fill"></span>
                </button>
            </div>

            <!-- Action Buttons - Paths corrected -->
            <div class="action-buttons">
                <a href="src/pages/login.html" class="btn btn-secondary" id="signInBtn">Sign in</a>
                <a href="src/pages/role-selection.html" class="btn btn-primary" id="mainCta">Get Started</a>
            </div>
        </footer>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - Path corrected for root level                   -->
    <!-- ============================================================ -->
    <script src="onboarding.js"></script>
</body>
</html>
