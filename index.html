<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceShare — On-Demand Workspace Marketplace</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Background Slider Container -->
    <div class="hero-slider" id="heroSlider">
        <!-- Slide 1 -->
        <div class="slide active" style="background-image: url('src/assets/splashscreen1.png');">
            <div class="slide-overlay"></div>
        </div>
        <!-- Slide 2 -->
        <div class="slide" style="background-image: url('src/assets/splashscreen2.jpeg');">
            <div class="slide-overlay"></div>
        </div>
        <!-- Slide 3 -->
        <div class="slide" style="background-image: url('src/assets/Splashscreen3.png');">
            <div class="slide-overlay"></div>
        </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="page-container">
        <!-- Header / Navigation -->
        <header class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
                        <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#A8D0FF"/>
                    </svg>
                </div>
                <span class="logo-text">SpaceShare</span>
            </div>
        </header>

        <!-- Hero Content Section -->
        <main class="hero-content">
            <div class="badge" id="slideBadge">FIND YOUR SPACE</div>
            
            <h1 class="hero-title" id="slideTitle">SpaceShare puts inspiring workspaces at your finger tips</h1>
            
            <p class="hero-subtitle" id="slideSubtitle">Browse, book and unlock unique spaces tailored to your vibe, anywhere and anytime.</p>
        </main>

        <!-- Footer Actions & Pagination -->
        <footer class="hero-footer">
            <div class="pagination-dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>

            <div class="action-buttons">
                <a href="pages/login.html" class="btn btn-secondary">Sign in</a>
                <a href="pages/signup.html" class="btn btn-primary">Get Started</a>
            </div>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
