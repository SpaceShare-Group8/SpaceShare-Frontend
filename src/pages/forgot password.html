<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="login-container">
        <a href="login.html" class="back-btn"><i class="ph ph-caret-left"></i></a>
        <div class="header">
            <h1>Forget Password</h1>
            <p class="subtitle">Input the email you used in registering the account</p>
        </div>
        

        <form id="forgotPasswordForm">
            <label for="email">Email Address</label>
            <div class="input-box">
                <i class="ph ph-envelope-simple"></i>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <!-- hidden error message -->
             <p id="email-error" class="error">
                Invalid email, please input a registered email.
             </p>
             <button type="submit" class="login-btn">Continue</button>
        </form>
    </div>

    <script src="../scripts/forgot password.js"></script>
    
</body>
</html>
