<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role Selection · SpaceShare</title>
  <link rel="stylesheet" href="../styles/role-selection.css" />
</head>
<body>
  <main class="role-selection" aria-labelledby="role-heading">
    <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M12.5 16L6.5 10L12.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <h1 id="role-heading">What brings you to <span class="brand">SpaceShare</span>?</h1>
    <p class="subtitle">You can always list a space later - this just sets your home screen.</p>

    <div class="role-options" role="radiogroup" aria-label="Select your role">
      <button
        type="button"
        class="role-card"
        id="role-seeker"
        data-role="seeker"
        role="radio"
        aria-checked="false"
      >
        <span class="radio-dot" aria-hidden="true"></span>
        <span class="role-card-text">
          <strong>Find a space</strong>
          <span>Book studios, venues and rooms nearby.</span>
        </span>
      </button>

      <button
        type="button"
        class="role-card"
        id="role-host"
        data-role="host"
        role="radio"
        aria-checked="false"
      >
        <span class="radio-dot" aria-hidden="true"></span>
        <span class="role-card-text">
          <strong>List a space</strong>
          <span>Earn from a room, studio or venue you manage.</span>
        </span>
      </button>
    </div>

    <button type="button" class="continue-btn" id="continueBtn" disabled>
      Continue
    </button>
    <p class="error-message" id="errorMessage" role="alert" hidden></p>
  </main>

  <script type="module" src="../scripts/role-selection.js"></script>
</body>
</html>
