<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

    <div class="login-container">
        <a href="otp.html" class="back-btn"><i class="ph ph-caret-left"></i></a>

        <div class="header">
            <h1>Reset Password</h1>
            <p class="subtitle">Create a new 6-digit password</p>
        </div>

        <form id="resetPasswordForm">
            <label for="newPassword">New Password</label>
            <div class="input-box">
                <input type="password" id="newPassword" placeholder="Enter new password" maxlength="6"> 
                <i class="ph ph-eye" id="toggleNewPassword"></i>
            </div>

            <label for="confirmPassword">Confirm password</label>
            <div class="input-box">
                <input type="password" id="confirmPassword" placeholder="Confirm password" maxlength="6">
                <i class="ph ph-eye" id="toggleConfirmPassword"></i>
            </div>

            <!-- error message -->
            <p id="password-error" class="error">Password do not match.</p>

            <button type="submit" class="login-btn">Update Password</button>
        </form>
    </div>

    <script src="../scripts/reset password.js"></script>
    
</body>
</html>
