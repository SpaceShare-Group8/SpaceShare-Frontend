<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - SpaceShare</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../styles/forgot-password.css" />
</head>
<body>
    <div class="forgot-page">
        <div class="forgot-container">
            
            <!-- Back Button -->
            <a href="login.html" class="back-btn" id="backBtn">
                <i class="ph ph-caret-left"></i>
            </a>

            <!-- Header -->
            <div class="forgot-header">
                <div class="icon-wrapper">
                    <div class="icon-circle">
                        <i class="ph-fill ph-key"></i>
                    </div>
                </div>
                <h1>Forgot Password</h1>
                <p class="forgot-subtitle">
                    Enter the email address you used to register<br />
                    and we'll send you a reset link.
                </p>
            </div>

            <!-- Form -->
            <form id="forgotPasswordForm" class="forgot-form" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="ph ph-envelope-simple"></i></span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="name@company.com" 
                            autocomplete="email" 
                            required 
                        />
                    </div>
                    <span class="field-error" id="emailError"></span>
                </div>

                <!-- Global Error Message -->
                <div id="formAlert" class="form-alert" role="alert" hidden></div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary">
                    <span class="btn-label">Send Reset Link</span>
                    <span class="btn-spinner" hidden><i class="ph ph-spinner"></i></span>
                </button>
            </form>

            <!-- Footer -->
            <div class="forgot-footer">
                <a href="login.html" class="back-to-login">
                    <i class="ph ph-arrow-left"></i> Back to Sign In
                </a>
            </div>

        </div>
    </div>

    <script src="../scripts/forgot-password.js"></script>
</body>
</html>
