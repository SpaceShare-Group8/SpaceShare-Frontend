<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceShare</title>

    <link rel="stylesheet" href="../styles/onboarding-web.css">
</head>
<body>

<div class="hero">

    <div class="overlay"></div>

    <div class="content">

        <!-- Logo -->
        <header class="header">
            <div class="logo">
                <img src="../../assests/BLUE LOGO 2.svg" alt="SpaceShare Logo">
                <h2>SpaceShare</h2>
            </div>
        </header>

        <!-- Text -->
        <section class="text-content">

            <span class="tag">
                CONNECT & COLLABORATE
            </span>

            <h1>
                Host, Share and Earn
            </h1>

            <p>
                List your underutilized space or discover stunning locations curated just for you.
            </p>

        </section>

        <!-- Bottom -->
        <footer class="bottom-content">

            <div class="dots">

                <span ></span>
                <span></span>
                <span class="active"></span>

            </div>

            <div class="buttons">

                <a href="#" class="btn btn-outline">
                    Sign in
                </a>

                <a href="../pages/create-account-web.html" class="btn btn-primary">
                    Get Started
                </a>

            </div>

        </footer>

    </div>
