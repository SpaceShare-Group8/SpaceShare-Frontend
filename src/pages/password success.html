<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="login-container success-page">

       <div class="success-content">
          <div class="success-icon">
               <div class="icon-circle">
                   <i class="ph ph-shield-check"></i>
               </div>
           </div>
        </div>
        
        <h1>Password Updated Successfully</h1>

        <p class="subtitle">
            Your password has been changed. You can now sign in with your new credentials.
        </p>

        <div class="security-card">
            <div class="security-header">
                <div class="shield-box">
                    <i class="ph ph-shield-check"></i>
                </div>

                <div>
                    <h3>Security Tip</h3>
                    <p class="security-text">Never share your password with anyone. Use a strong password and keep it private.</p>
                </div>
               
                
            </div>

            

        </div>

        <div class="success-btn-wrapper">
            <a href="login.html" class="success-btn">
               Sign in with new password
            </a>
        </div>

        
    </div>
    
</body>
</html>
