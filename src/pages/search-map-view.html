<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceShare — Search Results (Map View)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- PLACEHOLDER: CSS will be linked in the next step -->
    <link rel="stylesheet" href="../styles/search-map-view.css" />

    <!-- PLACEHOLDER: Leaflet.js CSS (Will be moved to CSS file later) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- ============================================================ -->
    <!-- MAIN MAP WRAPPER                                              -->
    <!-- ============================================================ -->
    <div class="map-page-wrapper">

        <!-- ========================================================== -->
        <!-- FULL SCREEN MAP CONTAINER                                  -->
        <!-- ========================================================== -->
        <div id="mapContainer" class="map-canvas"></div>

        <!-- ========================================================== -->
        <!-- FLOATING UI OVERLAYS                                       -->
        <!-- ========================================================== -->

        <!-- 1. MOBILE SEARCH HEADER (Top, Floating) -->
        <section class="mobile-search-header">
            <div class="search-pill-container">
                <button class="pill-back-btn" aria-label="Go back">
                    <i class="ph-bold ph-arrow-left"></i>
                </button>
                <div class="pill-location-wrapper">
                    <i class="ph-fill ph-map-pin"></i>
                    <span>Lekki, Lagos</span>
                </div>
                <button class="pill-filter-btn" aria-label="Open filters">
                    <i class="ph-fill ph-sliders"></i>
                </button>
            </div>
            <p class="search-pill-subtitle">2nd Aug, 2026 &bull; 10:00 am</p>
        </section>

        <!-- 2. DESKTOP SIDE SEARCH & FILTERS (Left, Vertical) -->
        <section class="desktop-side-interface">
            
            <!-- Search Bar -->
            <div class="desktop-search-bar">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search bookings, spaces, guests" class="desktop-search-input" />
            </div>

            <!-- Deep Search Pill (Vertical Layout) -->
            <div class="desktop-deep-pill">
                <div class="pill-segment">
                    <span class="pill-label">Location</span>
                    <span class="pill-value">Lekki, Lagos</span>
                </div>
                <div class="pill-divider"></div>
                <div class="pill-segment">
                    <span class="pill-label">Date</span>
                    <span class="pill-value">2nd Aug, 2026</span>
                </div>
                <div class="pill-divider"></div>
                <div class="pill-segment">
                    <span class="pill-label">Time</span>
                    <span class="pill-value">10:00 am</span>
                </div>
            </div>

            <!-- Vertical Filter Chips -->
            <div class="desktop-filter-chips">
                <div class="filter-chip-group">
                    <button class="filter-chip">Type <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Price <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Power <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Capacity <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Amenities <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Workspace <i class="ph-bold ph-caret-down"></i></button>
                    <button class="filter-chip">Availability <i class="ph-bold ph-caret-down"></i></button>
                </div>
                <!-- Toggle Map/List Button -->
                <button class="map-toggle-btn">
                    <i class="ph-bold ph-map-trifold"></i>
                </button>
            </div>

        </section>

        <!-- 3. MAP CONTROLS (Zoom In/Out) - Bottom Right -->
        <div class="map-controls">
            <button class="map-control-btn" id="zoomInBtn" aria-label="Zoom in">
                <i class="ph-bold ph-plus"></i>
            </button>
            <button class="map-control-btn" id="zoomOutBtn" aria-label="Zoom out">
                <i class="ph-bold ph-minus"></i>
            </button>
        </div>

        <!-- 4. BOTTOM SHEET CARD (Floating, Docked to Bottom) -->
        <section class="bottom-sheet">
            
            <!-- Handle/Indicator for drag (Mobile) -->
            <div class="bottom-sheet-handle"></div>

            <div class="bottom-sheet-content">
                
                <!-- Card Image Section -->
                <div class="bottom-sheet-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=400&q=80" alt="Hub One Workspace" class="bottom-sheet-img" />
                    <button class="bottom-sheet-fav-btn" aria-label="Add to favourites">
                        <i class="ph ph-heart"></i>
                    </button>
                </div>

                <!-- Card Details Section -->
                <div class="bottom-sheet-details">
                    
                    <div class="bottom-sheet-header">
                        <h3 class="bottom-sheet-title">Hub One Workspace</h3>
                        <button class="bottom-sheet-compare-btn" aria-label="Compare">
                            <i class="ph ph-arrows-left-right"></i>
                        </button>
                    </div>

                    <p class="bottom-sheet-subtitle">Coworking Space</p>

                    <div class="bottom-sheet-meta">
                        <div class="meta-rating">
                            <i class="ph-fill ph-star" style="color: #FFC107;"></i>
                            <span>4.8 <small>(120)</small></span>
                        </div>
                        <div class="meta-divider"></div>
                        <div class="meta-distance">
                            <i class="ph-fill ph-map-pin"></i>
                            <span>2.5 km Away</span>
                        </div>
                    </div>

                    <div class="bottom-sheet-amenities">
                        <span class="amenity-chip"><i class="ph-bold ph-wifi-high"></i> WiFi</span>
                        <span class="amenity-chip"><i class="ph-bold ph-snowflake"></i> AC</span>
                        <span class="amenity-chip"><i class="ph-fill ph-car-profile"></i> Parking</span>
                    </div>

                    <div class="bottom-sheet-footer">
                        <p class="bottom-sheet-price">₦15,000 <small>/hr</small></p>
                        <button class="btn-view-space">View Space <i class="ph-bold ph-caret-right"></i></button>
                    </div>

                </div>
            </div>
        </section>

    </div>

    <!-- PLACEHOLDER: Leaflet.js JS (Will be moved to JS file later) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- PLACEHOLDER: JS will be linked in the next step -->
    <script src="../scripts/search-map-view.js"></script>

</body>
</html>
