<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — SpaceShare</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../styles/login.css">
</head>
<body>

  <div class="auth-shell">

    <!-- Brand panel: same slider as the landing page, trimmed to one message -->
    <div class="brand-panel" aria-hidden="true">
      <div class="hero-slider" id="heroSlider">
        <div class="slide active" style="background-image:url('../assets/splashscreen1.png');"></div>
        <div class="slide" style="background-image:url('../assets/splashscreen2.jpeg');"></div>
        <div class="slide" style="background-image:url('../assets/Splashscreen3.png');"></div>
        <div class="slide-overlay"></div>
      </div>

      <div class="page-container">
        <header class="header">
          <div class="logo-container">
            <div class="logo-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
                <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#8FB4EC"/>
              </svg>
            </div>
            <span class="logo-text">SpaceShare</span>
          </div>
        </header>

        <main class="hero-content">
          <span class="badge">WELCOME BACK</span>
          <h1 class="hero-title">Your next workspace is one click away</h1>
          <p class="hero-subtitle">Sign in to manage bookings, message hosts, and pick up right where you left off.</p>
        </main>

        <footer class="hero-footer">
          <div class="pagination-dots">
            <span class="dot active"><span class="dot-fill"></span></span>
            <span class="dot"><span class="dot-fill"></span></span>
            <span class="dot"><span class="dot-fill"></span></span>
          </div>
        </footer>
      </div>
    </div>

    <!-- Form panel -->
    <div class="form-panel">
      <div class="form-wrap">

        <!-- Shown only on mobile, where the brand panel is hidden -->
        <div class="form-topbar">
          <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
              <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#8FB4EC"/>
            </svg>
          </div>
          <span class="logo-text">SpaceShare</span>
        </div>

        <a href="../../index.html" class="back-home">&larr; Back to home</a>

        <div class="form-header" style="margin-top:24px;">
          <h1>Sign in to your account</h1>
          <p>New to SpaceShare? <a href="signup.html">Create an account</a></p>
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="identifier">Email or phone number</label>
            <input type="text" id="identifier" name="identifier" placeholder="you@example.com" autocomplete="username" aria-invalid="false">
            <span class="field-error" id="identifierError"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" aria-invalid="false">
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember">
              <span>Keep me signed in</span>
            </label>
            <a href="#" class="link-muted">Forgot password?</a>
          </div>

          <div class="form-alert" id="formAlert" role="alert" hidden></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span class="btn-label">Sign in</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>

      </div>
    </div>

  </div>

  <script type="module" src="../scripts/login.js"></script>
</body>
</html>
