<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — SpaceShare</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../styles/signup.css">
</head>
<body>

  <div class="auth-shell">

    <!-- Brand panel: same slider as the landing page, trimmed to one message -->
    <div class="brand-panel" aria-hidden="true">
      <div class="hero-slider" id="heroSlider">
        <div class="slide active" style="background-image:url('../assets/Splashscreen3.png');"></div>
        <div class="slide" style="background-image:url('../assets/splashscreen1.png');"></div>
        <div class="slide" style="background-image:url('../assets/splashscreen2.jpeg');"></div>
        <div class="slide-overlay"></div>
      </div>

      <div class="page-container">
        <header class="header">
          <div class="logo-container">
            <div class="logo-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
                <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#8FB4EC"/>
              </svg>
            </div>
            <span class="logo-text">SpaceShare</span>
          </div>
        </header>

        <main class="hero-content">
          <span class="badge">JOIN SPACESHARE</span>
          <h1 class="hero-title">Host, share and earn — or find your next space</h1>
          <p class="hero-subtitle">Create an account to book unique workspaces, or list your own and start earning.</p>
        </main>

        <footer class="hero-footer">
          <div class="pagination-dots">
            <span class="dot active"><span class="dot-fill"></span></span>
            <span class="dot"><span class="dot-fill"></span></span>
            <span class="dot"><span class="dot-fill"></span></span>
          </div>
        </footer>
      </div>
    </div>

    <!-- Form panel -->
    <div class="form-panel">
      <div class="form-wrap">

        <!-- Shown only on mobile, where the brand panel is hidden -->
        <div class="form-topbar">
          <div class="logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 6L11 8.5V18L7 15.5V6Z" fill="#FFFFFF"/>
              <path d="M13 8.5L17 6V15.5L13 18V8.5Z" fill="#8FB4EC"/>
            </svg>
          </div>
          <span class="logo-text">SpaceShare</span>
        </div>

        <a href="../../index.html" class="back-home">&larr; Back to home</a>

        <div class="form-header" style="margin-top:24px;">
          <h1>Create your account</h1>
          <p>Already have one? <a href="login.html">Sign in</a></p>
        </div>

        <form id="signupForm" novalidate>

          <div class="role-toggle" id="roleToggle" role="group" aria-label="I want to">
            <button type="button" class="role-option" data-role="seeker" aria-pressed="true">Find a space</button>
            <button type="button" class="role-option" data-role="host" aria-pressed="false">Host a space</button>
          </div>
          <p class="role-hint" id="roleHint">You can switch this anytime from your account settings.</p>
          <input type="hidden" id="role" name="role" value="seeker">

          <div class="field">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" placeholder="Jane Doe" autocomplete="name" minlength="3" maxlength="150" aria-invalid="false">
            <span class="field-error" id="full_nameError"></span>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-invalid="false">
              <span class="field-error" id="emailError"></span>
            </div>

            <div class="field">
              <label for="phone">Phone <span style="font-weight:400;color:var(--white-50);">(optional)</span></label>
              <input type="tel" id="phone" name="phone" placeholder="+237 6XX XXX XXX" autocomplete="tel" aria-invalid="false">
              <span class="field-error" id="phoneError"></span>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" aria-invalid="false">
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="field">
            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" aria-invalid="false">
            <span class="field-error" id="confirm_passwordError"></span>
          </div>

          <div class="terms-row">
            <label class="checkbox">
              <input type="checkbox" id="terms" name="terms">
              <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>
            <span class="field-error" id="termsError"></span>
          </div>

          <div class="form-alert" id="formAlert" role="alert" hidden></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span class="btn-label">Create account</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>

      </div>
    </div>

  </div>

  <script type="module" src="../scripts/signup.js"></script>
</body>
</html>
