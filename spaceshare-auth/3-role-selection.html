<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space-Share — Choose your role</title>
<link rel="stylesheet" href="css/auth.css" />
<style>
  .role-options {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 24px 0 32px;
  }

  .role-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: #F5F5F5;
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
  }

  .role-card.selected {
    border: 2px solid var(--color-primary);
    background: #ffffff;
  }

  .role-radio {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--color-border);
    flex-shrink: 0;
    margin-top: 3px;
    position: relative;
  }

  .role-card.selected .role-radio {
    border-color: var(--color-primary);
  }

  .role-card.selected .role-radio::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--color-primary);
  }

  .role-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 700;
    color: var(--color-text);
  }

  .role-card p {
    margin: 0;
    font-size: 13px;
    color: var(--color-muted);
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="back-row">
    <button class="back-btn" onclick="window.history.back()">&larr;</button>
  </div>

  <div class="screen-content">
    <h1 class="title">What brings you to <span class="accent">SpaceShare?</span></h1>
    <p class="helper-text">You can always list a space later - this just sets your home screen.</p>

    <div class="role-options" id="role-options">
      <div class="role-card" data-role="seeker">
        <div class="role-radio"></div>
        <div>
          <h3>Find a space</h3>
          <p>Book studios, venues and rooms nearby.</p>
        </div>
      </div>

      <div class="role-card" data-role="host">
        <div class="role-radio"></div>
        <div>
          <h3>List a space</h3>
          <p>Earn from a room, studio or venue you manage.</p>
        </div>
      </div>
    </div>

    <button class="primary-btn" id="continue-btn" disabled>Continue</button>
  </div>
</div>

<script>
  const cards = document.querySelectorAll(".role-card");
  const continueBtn = document.getElementById("continue-btn");
  let selectedRole = null;

  cards.forEach((card) => {
    card.addEventListener("click", () => {
      cards.forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedRole = card.dataset.role;
      continueBtn.disabled = false;
    });
  });

  continueBtn.addEventListener("click", () => {
    if (!selectedRole) return;
    // Save the chosen role locally for now. Ask backend whether this should
    // also be sent to the server (e.g. a PATCH /api/auth/me or similar),
    // since right now it only lives in this browser.
    localStorage.setItem("user_role", selectedRole);

    // TODO: point this at your actual app's home/landing page once you
    // know what it's called (e.g. book.html from the booking flow).
    window.location.href = "home.html";
  });
</script>
</body>
</html>
